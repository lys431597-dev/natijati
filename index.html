<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجتي الدراسية</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f7f2;
  color: #222;
  text-align: center;
}
header {
  background: white;
  padding: 20px;
  border-bottom: 4px solid #168447;
}
.flag {
  width: 105px;
  height: 65px;
  margin: auto;
  background: linear-gradient(to bottom, #ce2028 33.33%, white 33.33%, white 66.66%, black 66.66%);
  border: 1px solid #ddd;
}
h1 { color: #168447; }
main {
  max-width: 430px;
  margin: 25px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 14px #0001;
}
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 13px;
  border-radius: 8px;
  font-size: 16px;
}
input { border: 1px solid #bbb; }
button {
  background: #168447;
  color: white;
  border: none;
  font-weight: bold;
}
#message { line-height: 1.8; }
#resultImage {
  display: none;
  width: 100%;
  height: auto;
  margin-top: 18px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
footer { padding: 20px; color: #666; }
</style>
</head>
<body>

<header>
  <div class="flag"></div>
  <h1>نتيجتي الدراسية</h1>
  <p>نظام الاستعلام عن النتيجة</p>
</header>

<main>
  <h2>أدخل معلوماتك</h2>

  <form id="resultForm">
    <input id="code" type="text" placeholder="أدخل الرمز" required>
    <input id="secret" type="password" placeholder="أدخل الكود السري" required>
    <button type="submit">بحث عن النتيجة</button>
  </form>

  <p id="message"></p>

  <img id="resultImage" src="natija.jpg" alt="صورة النتيجة">
</main>

<footer>نتيجتي الدراسية</footer>

<script>
const correctCode = "92565592431265";
const correctSecret = "650471978";

document.getElementById("resultForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const code = document.getElementById("code").value.trim();
  const secret = document.getElementById("secret").value.trim();
  const message = document.getElementById("message");
  const image = document.getElementById("resultImage");

  image.style.display = "none";

  if (code === correctCode && secret === correctSecret) {
    message.textContent = "جارٍ البحث عن النتيجة...";
    setTimeout(function() {
      message.textContent = "تم العثور على النتيجة";
      image.style.display = "block";
      image.onerror = function() {
        message.textContent = "تعذر تحميل الصورة. تأكد من أن اسمها natija.jpg";
      };
    }, 1200);
  } else {
    message.textContent = "الرمز أو الكود السري غير صحيح";
  }
});
</script>

</body>
</html>
